<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyra Store - Constellation HUD</title>
    
    <!-- Google Fonts: Montserrat (Futura Bold Italic style) & Inter (Body text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,600;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- Hojas de Estilos Modulares (Prompt Maestro) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <!-- Video de Fondo (Opcional) -->
    <video id="bg-video" loop muted playsinline class="bg-video-el hidden"></video>

    <!-- Canvas de Malla de Constelaciones (Fondo Interactivo) -->
    <canvas id="constellation-canvas"></canvas>
    
    <!-- Capas Cinemáticas -->
    <div class="panel-vignette"></div>
    <div class="scanlines"></div>

    <!-- CONTENEDOR PRINCIPAL DEL HUD -->
    <main class="hud-container" id="loading-container">
        
        <!-- ELEMENTO CENTRAL: Prisma Vectorial 3D y Círculos HUD -->
        <section class="hud-center-stage">
            <div class="hud-circles-bg">
                <span class="hud-ring ring-1"></span>
                <span class="hud-ring ring-2"></span>
                <span class="hud-ring ring-3"></span>
            </div>
            <!-- Canvas del Prisma 3D Rotativo (Octaedro) -->
            <canvas id="prism-canvas"></canvas>
        </section>

        <!-- ESQUINA SUPERIOR IZQUIERDA: Branding -->
        <div class="hud-corner top-left">
            <div class="brand-group">
                <div id="logo-container" class="logo-wrapper">
                    <!-- Logo de texto o imagen -->
                </div>
                <div class="brand-meta">
                    <h1 id="server-claim" class="server-title-text">ZYRA CORP</h1>
                    <span class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-label">SYS_ACTIVE</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- ESQUINA SUPERIOR DERECHA: Enlaces Oficiales -->
        <div class="hud-corner top-right" id="socials-panel">
            <nav class="hud-links-list" id="social-links-grid">
                <!-- Enlaces inyectados -->
            </nav>
        </div>

        <!-- ESQUINA INFERIOR IZQUIERDA: Reproductor de Música -->
        <div class="hud-corner bottom-left" id="music-card-wrapper">
            <div class="hud-player-wrapper">
                <div class="player-meta">
                    <span class="music-indicator"></span>
                    <div class="track-scroller">
                        <span class="track-label" id="track-title">LOADING STREAMING AUDIO...</span>
                    </div>
                </div>
                
                <div class="player-controls">
                    <button id="play-pause-btn" class="control-btn" aria-label="Play/Pause">
                        <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="12" height="12">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="pause-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="12" height="12">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    
                    <div class="volume-slider-group">
                        <button id="volume-mute-btn" class="vol-btn" aria-label="Mute">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="vol-svg">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                            </svg>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.15" class="vol-slider">
                    </div>
                </div>
            </div>
        </div>

        <!-- ESQUINA INFERIOR DERECHA: Fases y Progreso -->
        <div class="hud-corner bottom-right">
            <div class="hud-progress-wrapper">
                <div class="progress-percent-box">
                    <span id="progress-val-text" class="progress-pct">0%</span>
                </div>
                <div class="progress-log-box">
                    <span class="log-prefix">> CONFIG_SEQUENCE:</span>
                    <span id="log-text" class="log-text-el">Connecting to gateway...</span>
                </div>
            </div>
        </div>

    </main>

    <!-- Elemento Audio Oculto -->
    <audio id="bg-audio" loop preload="auto"></audio>

    <!-- Scripts Modulares -->
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/music.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/news.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
